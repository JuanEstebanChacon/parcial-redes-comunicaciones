map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# fecha|ip|servicio|metodo|uri|codigo|bytes|tiempo
log_format parcial '$time_iso8601|$remote_addr|$servicio|$request_method|$uri|$status|$body_bytes_sent|$request_time';

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    set $servicio otro;

    access_log /var/log/nginx/accesos.log parcial;
    access_log /var/log/nginx/access.log;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    location = /jupyter {
        return 301 /jupyter/;
    }

    location /jupyter/ {
        set $servicio jupyter;
        proxy_pass http://jupyter:8888;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 50m;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        set $servicio grafana;
        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Joomla en la raíz del sitio
    location / {
        set $servicio joomla;
        proxy_pass http://joomla:80;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
}